<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>G4F — Concepts da Home</title>
<style>
  :root { --bg:#0e0f12; --fg:#f4f4f5; --muted:#9a9ba3; --line:#26272d; }
  * { box-sizing:border-box; margin:0; }
  body { font-family: system-ui, -apple-system, sans-serif; background:var(--bg); color:var(--fg); min-height:100vh; display:grid; place-items:center; padding:24px 16px; }
  main { width:100%; max-width:880px; }
  h1 { font-size:clamp(28px,4vw,44px); font-weight:600; letter-spacing:-.02em; }
  p { color:var(--muted); margin-top:8px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; margin-top:40px; }
  a { display:block; padding:32px; border:1px solid var(--line); border-radius:16px; color:inherit; text-decoration:none; transition:border-color .2s, transform .2s; }
  a:hover { border-color:var(--fg); transform:translateY(-2px); }
  a span { color:var(--muted); font-size:14px; }
  a strong { display:block; font-size:24px; margin-top:8px; font-weight:600; }
</style>
</head>
<body>
<main>
  <h1>Site G4F — Home</h1>
  <p>Dois caminhos de conceito para a nova home. Escolha um para navegar.</p>
  <div class="grid">
    <a href="/concept-a/"><span>Concept A</span><strong>Em desenvolvimento</strong></a>
    <a href="/concept-b/"><span>Concept B</span><strong>Em desenvolvimento</strong></a>
  </div>
</main>
</body>
</html>
