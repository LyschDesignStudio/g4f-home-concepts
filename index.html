<style>
  /* Capa no estilo do deck (Figma Slides M0dhn5sOAjG75G3cuRcd3k, slide 1) */
  :root { --bg: #181716; --cream: #fbf5ea; --muted: #8a8378; --line: rgba(251, 245, 234, .16); }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body { background: var(--bg); color: var(--cream); font-family: 'IBM Plex Mono', ui-monospace, monospace; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; -webkit-font-smoothing: antialiased; }
  main { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 72px; padding: 48px 16px; }
  .logos { display: flex; align-items: center; justify-content: center; gap: clamp(32px, 4.2vw, 80px); }
  .logos svg { display: block; height: auto; }
  .logos .lysch { width: clamp(150px, 12vw, 231px); }
  .logos .g4f { width: clamp(131px, 10.5vw, 201px); }
  .choices { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .choice { display: flex; flex-direction: column; gap: 14px; width: 260px; padding: 22px 24px; border: 1px solid var(--line); color: var(--cream); text-decoration: none; transition: border-color .25s, background-color .25s, color .25s; }
  .choice__label { font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); transition: color .25s; }
  .choice__go { display: flex; justify-content: space-between; align-items: center; font-size: 20px; font-weight: 500; letter-spacing: .02em; text-transform: uppercase; }
  .choice__go span { transition: transform .25s; }
  .choice:hover, .choice:focus-visible { background: var(--cream); border-color: var(--cream); color: var(--bg); outline: none; }
  .choice:hover .choice__label, .choice:focus-visible .choice__label { color: var(--bg); }
  .choice:hover .choice__go span, .choice:focus-visible .choice__go span { transform: translateX(4px); }
  footer { display: flex; justify-content: space-between; gap: 16px; padding: 0 20px 19px; font-size: 13px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); }
  @media (max-width: 600px) {
    main { gap: 56px; }
    .choice { width: 100%; max-width: 343px; }
    footer { flex-direction: column; gap: 4px; font-size: 11px; padding: 0 16px 16px; }
  }
</style>
</head>
